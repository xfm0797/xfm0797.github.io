{% extend "base.html" %}
{% block main %}
<div class="layout-two">
  <div class="layout-main">
    <section class="page-banner">
      <p class="banner-eyebrow">{% if page.url.startsWith('/tags/') %}标签{% else %}分类{% endif %}</p>
      <h1 class="banner-title">{{ page.title }}</h1>
      {% if page.description %}<p class="banner-desc">{{ page.description }}</p>{% endif %}
    </section>
    <div class="post-grid">
      {% include "post-card.html" %}
    </div>
    {% include "pager.html" %}
  </div>
  {% include "sidebar.html" %}
</div>
{% endblock %}
